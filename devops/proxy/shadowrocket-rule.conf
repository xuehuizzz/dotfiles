[General]
# DNS 双路径分流（完整版）
# 国内 DNS：专供 DIRECT 域名（速度快 + CDN 准确）
dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
direct-dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query

# 国内备用 DNS
fallback-dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query

# 禁止直连域名使用系统 DNS
dns-direct-system = false

# 直连 DNS 失败时不转向代理（防止国内域名意外走代理）
dns-direct-fallback-proxy = false

# 禁止回退到系统 DNS（防泄漏）
dns-fallback-system = false

# 代理侧补充（推荐）

# 代理节点自身域名的解析（避免「先有节点还是先解析」的循环）
# 用国内 DoH 即可，因为节点域名通常不需要国外解析
proxy-dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query

# （可选）如果你希望「走代理的域名」也在本地用干净的国外 DNS 解析，
# 可以额外加下面这一行（把国外 DoH 强制走代理）：
# dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query,https://cloudflare-dns.com/dns-query#proxy,https://dns.google/dns-query#proxy
# 注意：上面这种写法会让所有域名都可能用到国外 DNS，国内 CDN 调度可能变差，一般不推荐日常使用。

# IPv6
ipv6 = true
prefer-ipv6 = false

# 局域网
private-ip-answer = true

# 网络行为
icmp-auto-reply = true


