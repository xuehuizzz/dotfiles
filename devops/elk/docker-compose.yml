services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
      TZ: ${TZ}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 6g
    # 仅绑定到宿主机回环地址：本机可 curl / 连 head，但不暴露到公网。
    # 9300 是节点间 transport 端口，单节点无需对宿主机映射。
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/usr/share/elasticsearch/plugins
    networks:
      - elk
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fs -u elastic:"$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health > /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: logstash
    environment:
      LOGSTASH_ES_USERNAME: ${LOGSTASH_ES_USERNAME}
      LOGSTASH_ES_PASSWORD: ${LOGSTASH_ES_PASSWORD}
      LS_JAVA_OPTS: ${LS_JAVA_OPTS}
      TZ: ${TZ}
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "127.0.0.1:5044:5044"    # 有远程 Filebeat 才改成 "5044:5044" + 防火墙 + TLS
    mem_limit: 2g
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}       # kibana.yml 里用 ${KIBANA_PASSWORD} 引用
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${XPACK_REPORTING_ENCRYPTIONKEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${XPACK_SECURITY_ENCRYPTIONKEY}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
    restart: unless-stopped

networks:
  elk:
    driver: bridge
