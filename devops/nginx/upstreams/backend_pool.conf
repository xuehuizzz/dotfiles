# =========================
# Upstream Backend Pool
# =========================
upstream backend_pool {

    # 共享内存区域
    # 让多个 worker 进程共享 upstream 状态，例如连接数、失败状态等
    # 需要 nginx >= 1.9.0
    zone backend_pool 64k;

    # 负载均衡算法：优先将请求分配给当前活跃连接数最少的后端
    least_conn;

    # 后端服务器 1
    # max_fails=3：30 秒内连续失败 3 次后，暂时认为该节点不可用
    # fail_timeout=30s：失败统计窗口，同时也是节点被临时标记不可用的时间
    server backend1.local:8080
        max_fails=3
        fail_timeout=30s;

    # 后端服务器 2
    server backend2.local:8080
        max_fails=3
        fail_timeout=30s;

    # 可选：设置权重
    # weight 越高，获得的请求比例越大
    # server backend3.local:8080
    #     weight=3
    #     max_fails=3
    #     fail_timeout=30s;

    # 可选：备用服务器
    # 只有当前面的主服务器全部不可用时才会接收请求
    # server backend4.local:8080 backup;

    # =========================
    # Upstream Keepalive
    # =========================

    # 每个 worker 缓存最多 64 个到后端的空闲长连接
    # 可减少 TCP/TLS 建连开销，提高高并发和高 QPS 场景性能
    keepalive 64;

    # 空闲 upstream 长连接最长保持 60 秒
    keepalive_timeout 60s;

    # 单条 upstream 长连接最多处理 1000 个请求后关闭重建
    # 避免连接长期存在导致资源或状态问题
    keepalive_requests 1000;
}
