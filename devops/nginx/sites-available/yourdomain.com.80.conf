# =========================
# HTTP → HTTPS Redirect
# =========================

server {

    # IPv4
    listen 80;

    # IPv6
    listen [::]:80;

    # 需要强制跳转到 HTTPS 的域名
    server_name yourdomain.com www.yourdomain.com;


    # =========================
    # ACME Certificate Renewal
    # =========================

    # 放行 Let's Encrypt / ACME HTTP-01 证书验证
    # 该 location 会由独立配置文件处理
    include /etc/nginx/snippets/acme-challenge.conf;


    # =========================
    # HTTP → HTTPS
    # =========================

    # 除 ACME Challenge 外的所有请求统一跳转 HTTPS
    location / {

        # 告诉浏览器不要缓存 HTTP → HTTPS 的重定向响应
        # 便于后续修改域名、跳转策略时立即生效
        add_header Cache-Control "no-store";

        # 保留原始 Host 和 URI
        # 例如：
        # http://yourdomain.com/test?a=1
        # ↓
        # https://yourdomain.com/test?a=1
        return 301 https://$host$request_uri;
    }
}
