# =========================
# Default Server / Unknown Host Protection
# =========================
#
# 处理没有匹配到任何合法 server_name 的请求。
#
# 常见场景：
#   1. 扫描器随机发送的 Host
#   2. 直接使用服务器 IP 访问
#   3. 恶意构造的未知域名
#   4. 未配置的其他 Host
#
# 目的：
#   不让未知 Host 进入正常业务站点，
#   降低扫描、Host Header 攻击以及无效请求对业务的干扰。


# =========================
# HTTP Default Server
# =========================

# 接收所有没有匹配到其他 server_name 的 HTTP 请求
server {
    listen 80 default_server;

    # 通配 server_name，作为默认兜底 Server
    server_name _;

    # 直接关闭连接，不返回正常 HTTP 响应
    # Nginx 444 为非标准状态码，用于主动关闭客户端连接
    return 444;

    # 关闭无效 Host 请求的访问日志
    # 减少扫描器产生的大量无意义日志
    access_log off;
}


# =========================
# HTTPS Default Server
# =========================

# 接收所有没有匹配到其他 server_name 的 HTTPS 请求
server {
    listen 443 ssl default_server;

    # 通配 server_name，作为默认兜底 Server
    server_name _;

    # 在 TLS 握手阶段直接拒绝未知 HTTPS Host
    #
    # nginx >= 1.19.4
    #
    # 使用该指令后无需配置假 SSL 证书，
    # Nginx 可以直接拒绝不属于本站的 TLS 握手
    ssl_reject_handshake on;

    # 关闭无效 HTTPS Host 请求的访问日志
    access_log off;
}
