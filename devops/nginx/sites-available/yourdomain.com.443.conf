# =========================
# HTTPS Main Application
# =========================

server {

    # =========================
    # HTTPS Listen
    # =========================

    # IPv4
    listen 443 ssl;

    # IPv6
    listen [::]:443 ssl;

    # HTTP/2
    # nginx >= 1.25.1
    http2 on;

    # 当前 HTTPS Server 支持的域名
    server_name yourdomain.com www.yourdomain.com;


    # =========================
    # TLS Certificate
    # =========================

    # SSL/TLS 证书、私钥及相关 TLS 配置
    include /etc/nginx/snippets/tls-yourdomain.com.conf;


    # =========================
    # Document Root
    # =========================

    # 静态资源目录
    # 静态文件存在时由 Nginx 直接返回
    root /var/www/yourdomain.com;


    # =========================
    # Main Application
    # =========================

    location / {

        # 基础安全 Header
        include /etc/nginx/snippets/security_headers.conf;


        # =========================
        # Rate Limit
        # =========================

        # 单 IP 请求频率限制
        # burst=40：允许短时间积累最多 40 个突发请求
        # nodelay：允许突发请求立即处理，不额外排队
        limit_req zone=perip burst=40 nodelay;

        # 单 IP 最大并发连接数
        limit_conn connperip 20;


        # =========================
        # Reverse Proxy
        # =========================

        # 将动态请求转发到后端服务器池
        proxy_pass http://backend_pool;

        # 转发客户端 IP、Host、协议等请求信息
        include /etc/nginx/snippets/proxy_params.conf;


        # =========================
        # Proxy Cache
        # =========================

        # 启用 upstream 响应缓存
        # 具体缓存策略由 proxy_cache.conf 统一管理
        include /etc/nginx/snippets/proxy_cache.conf;
    }


    # =========================
    # Static Resources
    # =========================

    # 常见静态资源直接由 Nginx 提供
    # 不经过后端应用，也不进入 proxy_cache
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {

        # 基础安全 Header
        include /etc/nginx/snippets/security_headers.conf;


        # =========================
        # Browser Cache
        # =========================

        # 浏览器缓存静态资源 30 天
        expires 30d;

        # 静态资源允许公共缓存
        # immutable 表示资源在缓存有效期内不会发生变化
        # 适合带版本号或内容 Hash 的静态文件
        add_header Cache-Control "public, immutable";


        # 静态资源访问量通常较大
        # 关闭 access log 可以减少磁盘 IO 和日志体积
        access_log off;


        # 本地存在静态文件时直接返回
        # 文件不存在时交给后端处理
        try_files $uri @backend;
    }


    # =========================
    # Backend Fallback
    # =========================

    # 静态资源不存在时使用 upstream 后端处理
    location @backend {

        proxy_pass http://backend_pool;

        # 统一代理请求 Header
        include /etc/nginx/snippets/proxy_params.conf;
    }


    # =========================
    # Health Check
    # =========================

    # 精确匹配健康检查接口
    location = /healthz {

        # 健康检查通常由监控系统频繁访问
        # 关闭访问日志，减少日志噪音
        access_log off;


        # 健康检查直接访问后端
        proxy_pass http://backend_pool;

        # 统一代理请求 Header
        include /etc/nginx/snippets/proxy_params.conf;


        # 健康检查不使用缓存
        # 确保每次检查都获取后端实时状态
        proxy_cache off;
    }
}
