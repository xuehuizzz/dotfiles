# =========================
# Security Headers
# =========================


# =========================
# HTTPS 强制策略
# =========================

# 启用 HSTS（HTTP Strict Transport Security）
# 告诉浏览器后续必须通过 HTTPS 访问当前站点
#
# max-age=31536000：
#   浏览器缓存 HSTS 策略 1 年
#
# includeSubDomains：
#   同时对所有子域名启用 HTTPS 强制策略
#
# always：
#   即使响应为 4xx / 5xx，也始终添加该 Header
#
# 注意：
#   启用 includeSubDomains 前，应确保所有子域名均支持 HTTPS
add_header Strict-Transport-Security
    "max-age=31536000; includeSubDomains"
    always;


# =========================
# MIME 类型安全
# =========================

# 禁止浏览器进行 MIME 类型嗅探
# 防止浏览器将响应内容错误解析成其他 MIME 类型
# 可降低部分 XSS、恶意文件执行等攻击风险
add_header X-Content-Type-Options
    "nosniff"
    always;


# =========================
# 点击劫持防护
# =========================

# 限制当前页面只能被同源页面通过 iframe / frame 嵌入
# 防止恶意网站利用 iframe 覆盖或诱导用户点击
#
# SAMEORIGIN：
#   仅允许相同 Origin 的页面嵌入
add_header X-Frame-Options
    "SAMEORIGIN"
    always;


# =========================
# Referrer 隐私策略
# =========================

# 控制浏览器发送 Referer 请求头时泄露的信息
#
# 同源请求：
#   发送完整 URL
#
# 跨源请求：
#   仅发送 Origin，例如 https://example.com
#
# HTTPS → HTTP：
#   不发送 Referer
#
# 在安全性、兼容性和统计分析之间取得较好的平衡
add_header Referrer-Policy
    "strict-origin-when-cross-origin"
    always;
