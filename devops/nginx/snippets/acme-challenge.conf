# =========================
# Let's Encrypt / ACME Challenge
# =========================

# 用于 Let's Encrypt 等 ACME CA 的 HTTP-01 域名验证
#
# CA 访问：
#   http://example.com/.well-known/acme-challenge/<TOKEN>
#
# Nginx 会从：
#   /var/www/acme/.well-known/acme-challenge/<TOKEN>
#
# 读取并返回验证文件
location ^~ /.well-known/acme-challenge/ {

    # ACME Challenge 文件根目录
    root /var/www/acme;

    # 验证文件以纯文本形式返回
    default_type "text/plain";

    # ACME 验证请求允许访问
    allow all;

    # 关闭 ACME 验证请求的访问日志
    # 避免证书续期时产生大量无意义的 access log
    access_log off;
}
