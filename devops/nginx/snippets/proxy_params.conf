# =========================
# Reverse Proxy Headers
# =========================

# 将客户端请求的原始 Host 传递给后端
proxy_set_header Host $host;

# 将客户端真实 IP 传递给后端
proxy_set_header X-Real-IP $remote_addr;

# 记录完整的代理链客户端 IP
# 每经过一层代理，客户端 IP 会追加到 X-Forwarded-For
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# 告诉后端客户端原始访问协议
# 例如：http 或 https
proxy_set_header X-Forwarded-Proto $scheme;

# 传递客户端请求的原始 Host
# 对生成绝对 URL、反向代理识别等场景有帮助
proxy_set_header X-Forwarded-Host $host;

# 传递客户端访问 Nginx 时使用的端口
# 例如：80、443、8080
proxy_set_header X-Forwarded-Port $server_port;


# =========================
# Upstream Keepalive / WebSocket
# =========================

# 清空 Connection 请求头
# 必须设置为空，否则可能携带 close 等 Connection 指令，
# 导致 upstream keepalive 长连接无法正常复用
proxy_set_header Connection "";

# 转发客户端的 Upgrade 请求头
# 用于 WebSocket 等协议升级场景
proxy_set_header Upgrade $http_upgrade;


# =========================
# Proxy Behavior
# =========================

# 禁止 Nginx 自动修改后端返回的重定向 Location 和 Refresh
# 保持后端返回的重定向地址原样传递给客户端
proxy_redirect off;
