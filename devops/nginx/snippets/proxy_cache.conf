# =========================
# Proxy Cache
# =========================

# 启用名为 my_cache 的缓存区域
# 该缓存区域需要提前通过 proxy_cache_path 定义
proxy_cache my_cache;


# =========================
# Cache Methods
# =========================

# 仅缓存 GET 和 HEAD 请求
# POST、PUT、DELETE 等请求默认不会进入缓存
proxy_cache_methods GET HEAD;


# =========================
# Cache Key
# =========================

# 定义缓存 Key
# 包含：
#   $scheme      请求协议，例如 http / https
#   $proxy_host  上游主机
#   $request_uri 完整请求 URI，包含 Query String
#
# 不同协议、不同上游、不同 URL 会生成不同缓存
proxy_cache_key $scheme$proxy_host$request_uri;


# =========================
# Cache Valid Time
# =========================

# 200 / 301 / 302 响应缓存 1 小时
proxy_cache_valid 200 301 302 1h;

# 404 响应缓存 1 分钟
# 防止不存在的资源被大量重复请求到后端
proxy_cache_valid 404 1m;

# 其他响应默认缓存 10 秒
proxy_cache_valid any 10s;


# =========================
# Authentication / Session Bypass
# =========================

# 带 Authorization 请求头时绕过缓存
# 避免认证用户获取公共缓存内容
proxy_cache_bypass $http_authorization;

# 带 sessionid Cookie 时绕过缓存
# 避免不同用户之间发生 Session / 登录状态串号
proxy_cache_bypass $cookie_sessionid;


# 带 Authorization 的响应不写入缓存
proxy_no_cache $http_authorization;

# 带 sessionid 的响应不写入缓存
proxy_no_cache $cookie_sessionid;


# =========================
# Background Cache Update
# =========================

# 缓存过期后允许后台更新
# 用户可以继续获得旧缓存，同时 Nginx 在后台请求后端刷新缓存
# 可降低缓存过期瞬间大量请求同时打到后端的概率
proxy_cache_background_update on;


# =========================
# Serve Stale Cache
# =========================

# 后端发生异常时允许返回旧缓存
# 提高服务可用性，避免后端短暂故障导致用户直接收到错误页面
proxy_cache_use_stale
    error        # 网络或上游错误
    timeout      # 上游响应超时
    updating     # 缓存正在后台更新
    http_500     # 后端内部错误
    http_502     # Bad Gateway
    http_503     # Service Unavailable
    http_504;    # Gateway Timeout


# =========================
# Cache Debug Header
# =========================

# 返回缓存状态，方便调试和监控
#
# 常见状态：
#   HIT       命中缓存
#   MISS      未命中缓存，访问后端
#   BYPASS    主动绕过缓存
#   EXPIRED   缓存已过期
#   STALE     返回旧缓存
#   UPDATING  正在后台更新缓存
#
add_header X-Cache-Status $upstream_cache_status always;

# 避免缓存未命中时，大量相同请求同时穿透到后端
proxy_cache_lock on;

# 等待其他请求填充缓存的最长时间
proxy_cache_lock_timeout 5s;
