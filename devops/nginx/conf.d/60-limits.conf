# =========================
# Rate Limit Zones
# =========================

# 每 IP 请求速率限制 Zone
# 仅定义共享内存区域，是否启用由各 location 中的 limit_req 决定
# rate=20r/s：单个 IP 平均每秒允许 20 个请求
limit_req_zone
    $binary_remote_addr
    zone=per_ip:10m
    rate=20r/s;


# 每 IP 并发连接限制 Zone
# 仅定义共享内存区域，是否启用由各 location 中的 limit_conn 决定
limit_conn_zone
    $binary_remote_addr
    zone=per_ip_conn:10m;


# =========================
# Rate Limit Response Status
# =========================

# 请求速率超过限制时返回 HTTP 429
limit_req_status 429;

# 并发连接超过限制时返回 HTTP 429
limit_conn_status 429;
