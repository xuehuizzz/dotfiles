# =========================
# 请求缓冲区
# =========================

client_max_body_size 20m;                    # 单个请求允许的最大请求体大小，超过后返回 413 Request Entity Too Large

client_body_buffer_size 128k;                # 请求体缓冲区大小，适用于 POST/PUT 等请求；超出部分可能写入临时文件

client_header_buffer_size 4k;                # 普通请求头缓冲区大小，用于接收客户端发送的 HTTP 请求头

large_client_header_buffers 4 16k;           # 超大请求头缓冲区：最多 4 个，每个 16KB；用于处理超长 Cookie、URI 等请求头

client_body_temp_path /var/cache/nginx/client_temp 1 2;  # 请求体临时文件存储路径，使用 1、2 级目录散列分布文件，减少单目录文件数量
