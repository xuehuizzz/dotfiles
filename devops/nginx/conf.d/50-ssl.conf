# ============================================================
# Global TLS / SSL
# ============================================================

# ------------------------------------------------------------
# TLS 协议版本
# ------------------------------------------------------------

# 仅允许 TLS 1.2 和 TLS 1.3。
# TLS 1.0 / 1.1 已被淘汰，不再启用。
ssl_protocols TLSv1.2 TLSv1.3;


# ------------------------------------------------------------
# TLSv1.2 Cipher Suites
# ------------------------------------------------------------

# 注意：
# ssl_ciphers 主要控制 TLS 1.2 及更早版本的 Cipher Suite。
#
# 使用 ECDHE + AES-GCM / ChaCha20-Poly1305，
# 提供前向保密（Forward Secrecy）以及现代 AEAD 加密。
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:
             ECDHE-RSA-AES128-GCM-SHA256:
             ECDHE-ECDSA-AES256-GCM-SHA384:
             ECDHE-RSA-AES256-GCM-SHA384:
             ECDHE-ECDSA-CHACHA20-POLY1305:
             ECDHE-RSA-CHACHA20-POLY1305;

# TLS 1.2 不强制服务器优先选择 Cipher。
# 让客户端根据自身硬件和实现选择更合适的 Cipher。
#
# TLS 1.3 不受该参数控制。
ssl_prefer_server_ciphers off;


# ------------------------------------------------------------
# TLSv1.3 Cipher Suites
# ------------------------------------------------------------

# TLS 1.3 的 Cipher Suite 独立于 ssl_ciphers。
#
# 需要：
#   Nginx >= 1.19.4
#   OpenSSL >= 1.1.1
#
# 三种均属于现代 AEAD Cipher：
# AES-128-GCM / AES-256-GCM / ChaCha20-Poly1305
ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:
                                TLS_AES_256_GCM_SHA384:
                                TLS_CHACHA20_POLY1305_SHA256;


# ------------------------------------------------------------
# TLS Session
# ------------------------------------------------------------

# 共享 TLS Session Cache。
# 10MB 用于保存 TLS Session 信息，可减少重复握手开销。
ssl_session_cache shared:SSL:10m;

# TLS Session 的有效时间。
ssl_session_timeout 1h;

# 禁用 TLS Session Tickets。
# 可以减少长期 Session Ticket 密钥管理带来的风险。
ssl_session_tickets off;


# ------------------------------------------------------------
# OCSP Stapling
# ------------------------------------------------------------

# 开启 OCSP Stapling。
# Nginx 在 TLS 握手时向客户端提供证书的 OCSP 状态，
# 减少客户端直接访问 CA OCSP Server 的需求。
ssl_stapling on;

# 验证 OCSP 响应。
# 可以提高 Stapling 响应的可信度。
ssl_stapling_verify on;


# ------------------------------------------------------------
# DNS Resolver
# ------------------------------------------------------------

# OCSP Stapling 等功能需要 DNS Resolver。
#
# 这里使用本机 DNS Resolver。
# 如果本机运行了 DNS 服务（例如 dnsmasq / systemd-resolved），
# 可以通过 127.0.0.1:53 解析域名。
resolver 127.0.0.1 valid=300s ipv6=off;

# DNS 查询超时时间。
resolver_timeout 5s;


# ------------------------------------------------------------
# Diffie-Hellman Parameters
# ------------------------------------------------------------

# DH 参数文件。
# 用于 DHE 类密钥交换。
#
# 建议使用至少 2048 bit 的 DH 参数。
ssl_dhparam /etc/nginx/ssl/dhparam2048.pem;
