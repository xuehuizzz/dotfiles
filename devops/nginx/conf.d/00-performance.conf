# =========================
# 基础性能优化
# =========================

sendfile on;                         # 启用零拷贝文件传输，减少用户态与内核态之间的数据拷贝，提升静态文件传输效率
tcp_nopush on;                       # 配合 sendfile 使用，尽量合并 TCP 数据包，减少小数据包数量，提升大文件传输效率
tcp_nodelay on;                      # 禁用 Nagle 算法，及时发送小数据包，降低交互式请求延迟

keepalive_timeout 65s;               # HTTP Keep-Alive 空闲连接保持时间，避免频繁建立和关闭 TCP 连接
keepalive_requests 1000;             # 单个 Keep-Alive 连接允许处理的最大请求数，避免连接长期复用导致资源持续占用

client_header_timeout 10s;           # 客户端发送完整请求头的最大等待时间，防止慢速或异常客户端长期占用连接
client_body_timeout 60s;             # 客户端发送请求体的最大间隔时间，适用于 POST/上传等请求
send_timeout 10s;                    # 向客户端发送响应数据时，两次写操作之间允许的最大空闲时间，防止慢客户端长期占用连接
reset_timedout_connection on;        # 超时连接直接发送 RST，快速释放连接相关资源，降低大量超时连接带来的资源消耗

server_tokens off;                   # 隐藏响应中的 Nginx 版本号，减少服务指纹信息暴露
types_hash_max_size 2048;            # MIME 类型哈希表大小，增加容量以减少类型较多时的哈希冲突
