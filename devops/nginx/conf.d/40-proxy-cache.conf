# ============================================================
# Nginx Reverse Proxy
# Proxy Buffer / Cache / Timeout
# ============================================================


# ============================================================
# 上游响应缓冲
# ============================================================

# 开启代理响应缓冲。
# Nginx 会先从上游读取响应并写入缓冲区，再向客户端发送，
# 可减少上游连接占用，并提高高并发场景下的稳定性。
proxy_buffering on;

# 用于保存上游响应头以及部分响应数据。
proxy_buffer_size 4k;

# 用于保存上游响应主体。
# 8 个 16KB 缓冲区，总计 128KB / 请求。
proxy_buffers 8 16k;

# 当响应正在向客户端发送时，最多允许占用的 busy buffer 总量。
# 32KB 对常规 API / 网页代理场景比较稳妥。
proxy_busy_buffers_size 32k;


# ============================================================
# 上游连接超时
# ============================================================

# 与上游服务器建立 TCP 连接的超时时间。
proxy_connect_timeout 5s;

# 向上游发送请求的超时时间。
proxy_send_timeout 30s;

# 从上游读取响应数据的超时时间。
proxy_read_timeout 30s;

# 使用 HTTP/1.1 与上游通信。
# 支持 keep-alive、chunked transfer 等 HTTP/1.1 特性。
proxy_http_version 1.1;


# ============================================================
# Proxy Cache
# ============================================================

# 本地磁盘缓存目录。
# levels=1:2 表示使用两级目录结构，避免单目录文件数量过大。
#
# keys_zone=my_cache:10m
#   为缓存元数据分配 10MB 共享内存。
#
# max_size=1g
#   磁盘缓存最大容量 1GB。
#
# inactive=1h
#   1 小时内没有被访问的缓存会被清理。
#
# use_temp_path=off
#   临时文件直接写入缓存目录，避免跨文件系统移动。
proxy_cache_path /data/nginx/cache
    levels=1:2
    keys_zone=my_cache:10m
    max_size=1g
    inactive=1h
    use_temp_path=off;


# ============================================================
# 缓存异常回退 / 防击穿
# ============================================================

# 上游出现异常时，如果存在可用的旧缓存，
# Nginx 可以直接返回 stale 内容，避免用户直接看到 502/503/504。
#
# error       上游连接/处理发生错误
# timeout     上游连接或读取超时
# updating    当前缓存正在被其他请求更新
# http_500    上游返回 500
# http_502    上游返回 502
# http_503    上游返回 503
# http_504    上游返回 504
proxy_cache_use_stale
    error
    timeout
    updating
    http_500
    http_502
    http_503
    http_504;


# 缓存过期后允许后台异步更新。
# 用户可以继续获得旧缓存，Nginx 在后台向上游刷新缓存，
# 减少缓存过期瞬间的延迟。
proxy_cache_background_update on;


# 开启缓存锁。
# 同一个 cache key 在缓存未命中时，只允许一个请求回源，
# 其他并发请求等待第一个请求完成，避免瞬间大量回源。
proxy_cache_lock on;

# 等待缓存锁的最长时间。
# 超过 5 秒后，请求不再继续等待锁。
proxy_cache_lock_timeout 5s;


# 开启缓存重新验证。
# 缓存过期后优先通过 If-Modified-Since / ETag 等机制
# 向上游进行条件请求。
#
# 如果资源没有变化，上游可以返回 304，
# 从而减少实际传输的数据量。
proxy_cache_revalidate on;
