# =========================
# Gzip 压缩
# =========================

gzip on;                                      # 启用 Gzip 压缩，减少文本类响应体积，降低网络带宽占用

gzip_min_length 1k;                           # 响应体达到 1KB 才进行压缩，避免对过小响应压缩后收益有限

gzip_comp_level 5;                            # Gzip 压缩级别 1~9，5 是压缩率与 CPU 消耗之间较均衡的选择

gzip_vary on;                                 # 添加 Vary: Accept-Encoding，确保缓存系统区分压缩与未压缩版本

gzip_proxied any;                             # 对反向代理请求的响应启用 Gzip 压缩，不限制代理相关请求条件

gzip_disable "msie6";                         # 禁用对旧版 Internet Explorer 6 的 Gzip 支持，兼容历史客户端

# text/html 默认由 Nginx 压缩，无需在 gzip_types 中重复配置
gzip_types
    text/plain                                  # 纯文本
    text/css                                    # CSS 样式表
    text/xml                                    # XML 文档
    text/javascript                             # JavaScript
    application/json                            # JSON 数据
    application/javascript                      # JavaScript
    application/xml                             # XML 数据
    application/rss+xml                         # RSS Feed
    application/atom+xml                        # Atom Feed
    image/svg+xml                               # SVG 矢量图
    font/woff2;                                 # WOFF2 Web 字体
