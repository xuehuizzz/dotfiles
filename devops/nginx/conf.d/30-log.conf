# =========================
# 日志配置
# =========================

# 自定义访问日志格式
# escape=json：对特殊字符进行 JSON 转义，避免 User-Agent、Referer 等字段
# 中出现特殊字符时破坏日志结构，方便后续接入 Loki / ELK / ClickHouse 等日志系统。
#
# rt  = Nginx 从收到请求到完成响应的总耗时
# uct = 与上游服务器建立连接的耗时
# uht = 从连接上游到收到上游响应头的耗时
# urt = 从连接上游到完成接收上游响应的耗时
# upstream = 实际处理请求的上游服务器地址
# ustatus = 上游服务器返回的 HTTP 状态码
# cache = 上游缓存状态，例如 HIT / MISS / EXPIRED / BYPASS

log_format main escape=json
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for" '
    'rt=$request_time '
    'uct=$upstream_connect_time '
    'uht=$upstream_header_time '
    'urt=$upstream_response_time '
    'upstream=$upstream_addr '
    'ustatus=$upstream_status '
    'cache=$upstream_cache_status';

# access.log 使用缓冲写入，减少频繁磁盘 I/O
# buffer=64k：日志累计到 64 KB 左右时写入磁盘
# flush=5s：即使未达到 64 KB，最多等待 5 秒也会写入
access_log /var/log/nginx/access.log main buffer=64k flush=5s;

# error_log 使用 warn 级别
# 记录 warning 及以上级别的错误，兼顾排障能力与日志量
error_log /var/log/nginx/error.log warn;
