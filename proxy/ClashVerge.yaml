# Clash Verge Rev / Mihomo 配置
# 转换自你提供的 Shadowrocket 规则

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true

# ==================== DNS 配置 ====================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 代理域名使用的 DNS（走代理解析）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 国内域名专用 DNS（直连解析，提高 CDN 准确性）
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# ==================== 规则 ====================
rules:
  # 1. 局域网直连
  - RULE-SET,lan,DIRECT

  # 2. 广告拦截
  - RULE-SET,reject,REJECT
  - RULE-SET,reject_domain,REJECT

  # 3. AI 服务代理（优先级高）
  - RULE-SET,openai,PROXY
  - RULE-SET,claude,PROXY
  - RULE-SET,gemini,PROXY
  - RULE-SET,copilot,PROXY
  - DOMAIN-SUFFIX,perplexity.ai,PROXY
  - DOMAIN-SUFFIX,grok.com,PROXY
  - DOMAIN-SUFFIX,x.ai,PROXY
  - DOMAIN-SUFFIX,cursor.com,PROXY
  - DOMAIN-SUFFIX,b.ai,PROXY
  - DOMAIN-SUFFIX,deepseek.com,PROXY

  # 4. Google 与 YouTube
  - RULE-SET,youtube,PROXY
  - RULE-SET,google,PROXY

  # 5. 社交与通讯
  - RULE-SET,telegram,PROXY
  - RULE-SET,twitter,PROXY
  - RULE-SET,instagram,PROXY
  - RULE-SET,facebook,PROXY
  - RULE-SET,discord,PROXY

  # 6. 开发工具
  - RULE-SET,github,PROXY

  # 7. 流媒体
  - RULE-SET,netflix,PROXY
  - RULE-SET,disney,PROXY
  - RULE-SET,spotify,PROXY

  # 8. Apple 服务直连
  - RULE-SET,apple,DIRECT
  - RULE-SET,apple_domain,DIRECT

  # 9. Microsoft 服务直连
  - RULE-SET,microsoft,DIRECT

  # 10. 中国大陆域名直连
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn_domain,DIRECT

  # 11. 中国大陆 IP 直连
  - GEOIP,CN,DIRECT,no-resolve

  # 12. 最终兜底
  - MATCH,PROXY

# ==================== 规则集（Rule Providers）====================
rule-providers:
